version: 2

sources:
  - name: raw
    schema: gz_raw_data
    description: >
      Raw Greenweez dataset containing the sales, product, and shipping tables.
      Each table comes directly from the source system, without any transformation.

    tables:
      - name: sales
        identifier: raw_gz_sales
        description: >
          Contains all sales transactions from Greenweez.
          Each row corresponds to one product (product_id) within a given order (order_id).
        columns:
          - name: date_date
            description: Date of purchase
          - name: order_id
            description: Unique identifier of the order
          - name: pdt_id
            description: Product identifier (will be renamed to products_id in staging)
          - name: quantity
            description: Quantity of the product purchased
          - name: turnover
            description: Revenue generated by this line item
          - name: margin
            description: Margin generated by this line item

      - name: product
        identifier: raw_gz_product
        description: >
          Contains product master data, including purchase price and product categories.
        columns:
          - name: product_id
            description: Unique identifier of the product
          - name: purchse_price
            description: Purchase price of the product (will be renamed to purchase_price and cast as FLOAT64)
          - name: category
            description: Category of the product
          - name: name
            description: Name of the product

      - name: ship
        identifier: raw_gz_ship
        description: >
          Contains shipping information for each order, including shipping fees and costs.
        columns:
          - name: ship_id
            description: Unique identifier of the shipment
          - name: order_id
            description: Unique identifier of the related order
          - name: shipping_fee
            description: Shipping fee charged to the customer
          - name: shipping_fee_1
            description: Duplicate of shipping_fee (to be validated and dropped)
          - name: ship_cost
            description: Shipping cost paid by Greenweez (to be cast to an appropriate numeric type)